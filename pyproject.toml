[project]
name = "knowledge-assistant-workspace"
version = "0.0.0"
requires-python = "==3.13.14"
dependencies = []

[tool.uv.workspace]
members = ["services/api", "python-packages/telemetry-python"]

[tool.ruff]
line-length = 100

[tool.mypy]
strict = true

[tool.pytest.ini_options]
testpaths = ["services/api/tests", "python-packages/telemetry-python/tests"]
addopts = "-ra"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=1.19.1",
    "pre-commit>=4.6.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.14.9",
]
