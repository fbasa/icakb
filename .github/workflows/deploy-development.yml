name: Deploy Development

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: development-deployment
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
  AWS_ROLE_TO_ASSUME: ${{ vars.AWS_ROLE_TO_ASSUME }}
  AWS_ECR_REPOSITORY: ${{ vars.AWS_ECR_REPOSITORY }}
  AWS_ECS_CLUSTER: ${{ vars.AWS_ECS_CLUSTER }}
  AWS_ECS_SERVICE: ${{ vars.AWS_ECS_SERVICE }}
  AWS_ECS_TASK_DEFINITION: ${{ vars.AWS_ECS_TASK_DEFINITION }}
  AWS_ECS_CONTAINER_NAME: ${{ vars.AWS_ECS_CONTAINER_NAME }}
  DEVELOPMENT_BASE_URL: ${{ vars.DEVELOPMENT_BASE_URL }}

jobs:
  build_image:
    name: Build and publish API image
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    outputs:
      image_uri: ${{ steps.publish.outputs.image_uri }}
      image_digest: ${{ steps.publish.outputs.image_digest }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Configure AWS credentials through OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Publish immutable API image to ECR
        id: publish
        run: |
          set -euo pipefail

          IMAGE_URI="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${AWS_ECR_REPOSITORY}"
          METADATA_FILE="${RUNNER_TEMP}/build-metadata.json"

          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login \
              --username AWS \
              --password-stdin "${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"

          docker buildx build \
            --file services/api/Dockerfile \
            --platform linux/amd64 \
            --build-arg APP_VERSION=0.0.0-dev \
            --build-arg APP_COMMIT_SHA="${GITHUB_SHA}" \
            --build-arg APP_BUILD_TIME="$(date -u +"%Y-%m-%dT%H:%M:%SZ")" \
            --build-arg GITHUB_REPOSITORY="${GITHUB_REPOSITORY}" \
            --tag "${IMAGE_URI}:${GITHUB_SHA}" \
            --push \
            --metadata-file "$METADATA_FILE" \
            .

          IMAGE_DIGEST="$(jq -r '.["containerimage.digest"]' "$METADATA_FILE")"
          if [ -z "$IMAGE_DIGEST" ] || [ "$IMAGE_DIGEST" = "null" ]; then
            echo "Unable to resolve image digest from build metadata" >&2
            exit 1
          fi

          echo "image_uri=${IMAGE_URI}" >> "$GITHUB_OUTPUT"
          echo "image_digest=${IMAGE_DIGEST}" >> "$GITHUB_OUTPUT"

  scan_image:
    name: Scan immutable API image
    runs-on: ubuntu-latest
    needs: build_image
    steps:
      - name: Configure AWS credentials through OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Scan published API image digest
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ needs.build_image.outputs.image_uri }}@${{ needs.build_image.outputs.image_digest }}
          scanners: "vuln,misconfig,secret"
          ignore-unfixed: false
          severity: HIGH,CRITICAL
          format: table
          exit-code: "1"

  deploy_development:
    name: Deploy to development
    runs-on: ubuntu-latest
    needs:
      - build_image
      - scan_image
    environment: development
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Sync Python workspace
        run: uv sync --frozen --all-packages

      - name: Configure AWS credentials through OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Register immutable task definition revision
        id: register-task-definition
        run: |
          set -euo pipefail

          IMAGE_REFERENCE="${{ needs.build_image.outputs.image_uri }}@${{ needs.build_image.outputs.image_digest }}"
          TASK_DEF_FILE="${RUNNER_TEMP}/task-definition.json"

          aws ecs describe-task-definition \
            --task-definition "$AWS_ECS_TASK_DEFINITION" \
            | jq --arg IMAGE "$IMAGE_REFERENCE" --arg NAME "$AWS_ECS_CONTAINER_NAME" '
                .taskDefinition
                | del(
                    .taskDefinitionArn,
                    .revision,
                    .status,
                    .requiresAttributes,
                    .compatibilities,
                    .registeredAt,
                    .registeredBy
                  )
                | if ([.containerDefinitions[] | select(.name == $NAME)] | length) != 1
                  then error("expected exactly one matching container")
                  else .
                  end
                | .containerDefinitions = (
                    .containerDefinitions
                    | map(if .name == $NAME then .image = $IMAGE else . end)
                  )
              ' > "$TASK_DEF_FILE"

          NEW_TASK_DEF_ARN="$(
            aws ecs register-task-definition \
              --cli-input-json "file://${TASK_DEF_FILE}" \
              | jq -r '.taskDefinition.taskDefinitionArn'
          )"

          if [ -z "$NEW_TASK_DEF_ARN" ] || [ "$NEW_TASK_DEF_ARN" = "null" ]; then
            echo "Unable to register task definition" >&2
            exit 1
          fi

          echo "task_definition_arn=${NEW_TASK_DEF_ARN}" >> "$GITHUB_OUTPUT"

      - name: Update development service
        run: |
          set -euo pipefail

          aws ecs update-service \
            --cluster "$AWS_ECS_CLUSTER" \
            --service "$AWS_ECS_SERVICE" \
            --task-definition "${{ steps.register-task-definition.outputs.task_definition_arn }}" \
            --force-new-deployment

      - name: Wait for development service stability
        run: |
          set -euo pipefail

          aws ecs wait services-stable \
            --cluster "$AWS_ECS_CLUSTER" \
            --services "$AWS_ECS_SERVICE"

      - name: Verify deployed health and version
        run: |
          set -euo pipefail

          if [ -z "$DEVELOPMENT_BASE_URL" ]; then
            echo "DEVELOPMENT_BASE_URL repository variable is required" >&2
            exit 1
          fi

          BASE_URL="$DEVELOPMENT_BASE_URL" \
          EXPECTED_VERSION="0.0.0-dev" \
          uv run --all-packages pytest tests/smoke/test_version_endpoint.py -q

          DEPLOYED_SHA="$(
            curl --fail --silent "$DEVELOPMENT_BASE_URL/version" | jq -r '.commit_sha'
          )"
          if [ "$DEPLOYED_SHA" != "$GITHUB_SHA" ]; then
            echo "Expected deployed commit $GITHUB_SHA but found $DEPLOYED_SHA" >&2
            exit 1
          fi
