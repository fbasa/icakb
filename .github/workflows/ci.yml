name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION_FILE: .node-version
  PYTHON_VERSION_FILE: .python-version

jobs:
  repository-checks:
    name: Repository checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ${{ env.PYTHON_VERSION_FILE }}

      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Sync Python workspace
        run: uv sync --frozen --all-packages

      - name: Run Ruff format check
        run: uv run --all-packages ruff format --check python-packages services

      - name: Run Ruff lint
        run: uv run --all-packages ruff check python-packages services

      - name: Run Python type checks
        run: uv run --all-packages mypy python-packages services

      - name: Run repository pre-commit checks
        run: uv run pre-commit run --all-files

      - name: Run Python tests
        run: uv run --all-packages pytest

  application-builds:
    name: Application builds
    runs-on: ubuntu-latest
    needs: repository-checks
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ${{ env.NODE_VERSION_FILE }}

      - name: Enable corepack
        run: corepack enable

      - name: Activate pinned pnpm
        run: corepack prepare pnpm@11.17.0 --activate

      - name: Install JavaScript workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Check JavaScript and documentation formatting
        run: pnpm format:check

      - name: Lint JavaScript and TypeScript sources
        run: pnpm lint

      - name: Run TypeScript type checks
        run: pnpm typecheck

      - name: Run Vitest suite
        run: pnpm test:vitest

      - name: Run root JavaScript build command
        run: pnpm build

      - name: Build assistant web app
        run: pnpm --dir apps/assistant-web build

      - name: Build administration web app
        run: pnpm --dir apps/admin-web build

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright browser smoke tests
        run: pnpm test:playwright

  api-container-build:
    name: API container build
    runs-on: ubuntu-latest
    needs: repository-checks
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build API container image
        run: |
          docker build \
            --file services/api/Dockerfile \
            --build-arg APP_VERSION=0.0.0-dev \
            --build-arg APP_COMMIT_SHA=${{ github.sha }} \
            --build-arg APP_BUILD_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ") \
            --build-arg GITHUB_REPOSITORY=${{ github.repository }} \
            --tag knowledge-assistant-api:${{ github.sha }} \
            .
