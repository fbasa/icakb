name: Rollback Development

on:
  workflow_dispatch:
    inputs:
      task_definition_arn:
        description: Known-good ECS task definition ARN to restore.
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: development-deployment
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  AWS_ROLE_TO_ASSUME: ${{ vars.AWS_ROLE_TO_ASSUME }}
  AWS_ECS_CLUSTER: ${{ vars.AWS_ECS_CLUSTER }}
  AWS_ECS_SERVICE: ${{ vars.AWS_ECS_SERVICE }}
  DEVELOPMENT_BASE_URL: ${{ vars.DEVELOPMENT_BASE_URL }}

jobs:
  rollback_development:
    name: Roll back development service
    runs-on: ubuntu-latest
    environment: development
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Sync Python workspace
        run: uv sync --frozen --all-packages

      - name: Configure AWS credentials through OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Restore known-good task definition
        run: |
          set -euo pipefail

          aws ecs describe-task-definition \
            --task-definition "${{ inputs.task_definition_arn }}" \
            >/dev/null

          aws ecs update-service \
            --cluster "$AWS_ECS_CLUSTER" \
            --service "$AWS_ECS_SERVICE" \
            --task-definition "${{ inputs.task_definition_arn }}" \
            --force-new-deployment

      - name: Wait for rolled-back service stability
        run: |
          set -euo pipefail

          aws ecs wait services-stable \
            --cluster "$AWS_ECS_CLUSTER" \
            --services "$AWS_ECS_SERVICE"

      - name: Verify rolled-back service health
        run: |
          set -euo pipefail

          if [ -z "$DEVELOPMENT_BASE_URL" ]; then
            echo "DEVELOPMENT_BASE_URL repository variable is required" >&2
            exit 1
          fi

          BASE_URL="$DEVELOPMENT_BASE_URL" \
          uv run --all-packages pytest tests/smoke/test_version_endpoint.py -q
