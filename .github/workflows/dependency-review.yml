name: Dependency Review

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Dependency review
        id: dependency-review
        continue-on-error: true
        uses: actions/dependency-review-action@v5

      - name: Report dependency-review availability
        if: steps.dependency-review.outcome == 'failure'
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'MARKDOWN'
          Dependency Review could not run because GitHub dependency graph is not enabled
          or is unsupported for this repository. Enable dependency graph in repository
          security settings, then remove `continue-on-error` from this workflow.
          MARKDOWN
