version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "docker"
    directory: "/services/api"
    schedule:
      interval: "weekly"
  - package-ecosystem: "terraform"
    directory: "/infra/terraform/environments/development"
    schedule:
      interval: "weekly"
  - package-ecosystem: "terraform"
    directory: "/infra/terraform/environments/staging"
    schedule:
      interval: "weekly"
  - package-ecosystem: "terraform"
    directory: "/infra/terraform/environments/production"
    schedule:
      interval: "weekly"
