name: knowledge-assistant
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: knowledge_assistant
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d knowledge_assistant"]
      interval: 5s
      timeout: 3s
      retries: 10
