[project]
name = "icakb-api"
version = "0.0.0"
requires-python = "==3.13.14"
dependencies = [
  "fastapi>=0.115,<1",
  "opentelemetry-api>=1.36,<2",
  "opentelemetry-sdk>=1.36,<2",
  "telemetry-python",
  "uvicorn[standard]>=0.30,<1",
]

[build-system]
requires = ["hatchling>=1.31.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/icakb_api"]

[tool.uv.sources]
telemetry-python = { workspace = true }
